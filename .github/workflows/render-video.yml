name: Render Remotion Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Render Video
        run: npx remotion render src/remotion-entry.ts DiamondRain out/video.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: ocean-vs-sea-video
          path: out/video.mp4
